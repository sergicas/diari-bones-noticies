<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="title">
  <title id="title">Composició Mondrian d'El Bon Diari</title>

  <!-- Cel·les (colors primaris De Stijl) -->
  <rect x="0" y="0" width="128" height="88" fill="#E72A30" />
  <rect x="128" y="0" width="96" height="88" fill="#FFE000" />
  <rect x="224" y="0" width="96" height="88" fill="#FFFFFF" />

  <rect x="0" y="88" width="96" height="80" fill="#FFFFFF" />
  <rect x="96" y="88" width="128" height="80" fill="#000000" />
  <rect x="224" y="88" width="96" height="80" fill="#FFE000" />

  <rect x="0" y="168" width="128" height="72" fill="#1E50A0" />
  <rect x="128" y="168" width="192" height="72" fill="#E72A30" />

  <!-- Línies negres a l'estil De Stijl (verticals + horitzontals gruixudes) -->
