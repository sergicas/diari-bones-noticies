    <!-- Horitzontals -->
    <rect x="0" y="84" width="320" height="8" />
    <rect x="0" y="164" width="320" height="8" />
    <!-- Verticals -->
    <rect x="124" y="0" width="8" height="172" />
    <rect x="220" y="0" width="8" height="172" />
    <rect x="92" y="84" width="8" height="84" />
    <rect x="124" y="164" width="8" height="76" />
  </g>
</svg>
