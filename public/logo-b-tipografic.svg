<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">El Bon Diari — B tipogràfica</title>
  <desc id="desc">Lletra B en serif editorial amb un punt solar com a accent.</desc>

  <!-- Fons cremós -->
  <rect width="96" height="96" rx="20" fill="#F8F2E2" />

  <!-- Punt solar a sobre -->
  <circle cx="68" cy="22" r="6" fill="#E0A044" />

  <!-- B en serif, dibuixada com a paths simples -->
  <g fill="#146356">
    <!-- Bastó vertical -->
    <rect x="22" y="22" width="10" height="56" rx="1.5" />
    <!-- Coberta superior del primer ull -->
    <path d="M32 22h22a16 16 0 0 1 0 32H32V42h22a6 6 0 0 0 0-12H32V22Z" />
    <!-- Coberta inferior del segon ull -->
    <path d="M32 46h26a16 16 0 0 1 0 32H32V66h26a6 6 0 0 0 0-12H32V46Z" />
  </g>
</svg>
