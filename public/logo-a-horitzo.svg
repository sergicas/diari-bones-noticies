<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">El Bon Diari — Horitzó</title>
  <desc id="desc">Sol que emergeix d'un horitzó en tres capes.</desc>

  <!-- Cercle de fons rodó suau -->
  <circle cx="48" cy="48" r="44" fill="#F4EFE4" />

  <!-- Sol -->
  <circle cx="48" cy="42" r="14" fill="#E0A044" />

  <!-- Horitzó: tres línies de gruix decreixent -->
  <path d="M14 60h68" stroke="#146356" stroke-width="3.5" stroke-linecap="round" />
  <path d="M20 68h56" stroke="#146356" stroke-width="2.4" stroke-linecap="round" opacity=".65" />
  <path d="M28 75h40" stroke="#146356" stroke-width="1.8" stroke-linecap="round" opacity=".35" />
</svg>
