<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">El Bon Diari — Arc i sol</title>
  <desc id="desc">Un arc verd s'eleva sota un sol obert; el conjunt suggereix un horitzó constructiu.</desc>

  <defs>
    <linearGradient id="bg-soft" x1="0" y1="0" x2="0" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFCF2" />
      <stop offset="1" stop-color="#F0E5C8" />
    </linearGradient>
  </defs>

  <!-- Fons suau -->
  <rect width="96" height="96" rx="24" fill="url(#bg-soft)" />

  <!-- Sol amb raigs curts -->
  <g stroke="#E0A044" stroke-width="2.4" stroke-linecap="round" fill="none">
    <line x1="48" y1="14" x2="48" y2="20" />
    <line x1="64" y1="20" x2="60" y2="25" />
    <line x1="32" y1="20" x2="36" y2="25" />
    <line x1="70" y1="32" x2="64" y2="34" />
    <line x1="26" y1="32" x2="32" y2="34" />
  </g>
  <circle cx="48" cy="36" r="9" fill="#E0A044" />

  <!-- Arc verd que s'eleva: representa l'horitzó i el moviment positiu -->
  <path d="M14 76 Q 48 48, 82 76"
        fill="none"
        stroke="#146356"
        stroke-width="4"
        stroke-linecap="round" />
</svg>
