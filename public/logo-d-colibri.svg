<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">El Bon Diari — Colibrí</title>
  <desc id="desc">Colibrí origami amb bec llarg, cos rodó facetat, ala oberta, potes i cua en ventall.</desc>

  <g fill="#0A0A0A" stroke="#FFFFFF" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round">

    <!-- BEC -->
    <polygon points="58,30 96,8 60,33" />
    <polygon points="60,33 96,8 62,36" />

    <!-- CAP -->
    <polygon points="52,26 58,30 56,36" />
    <polygon points="46,28 52,26 50,36" />
    <polygon points="56,36 60,33 58,40" />
    <polygon points="50,36 56,36 52,40" />

    <!-- COS rodó, 8 facetes des del centre (46, 48) -->
    <polygon points="46,48 46,36 54,38" />
    <polygon points="46,48 54,38 58,44" />
    <polygon points="46,48 58,44 56,52" />
    <polygon points="46,48 56,52 50,58" />
    <polygon points="46,48 50,58 42,58" />
    <polygon points="46,48 42,58 36,52" />
    <polygon points="46,48 36,52 38,42" />
    <polygon points="46,48 38,42 46,36" />

    <!-- POTES, fines i curtes des del ventre -->
    <polygon points="43,58 42,66 44,66 45,58" />
    <polygon points="49,58 48,66 50,66 51,58" />
    <polygon points="40,66 45,66 43,68" />
    <polygon points="46,66 52,66 49,68" />

    <!-- ALA: 5 plomes primàries des de l'espatlla (54, 40), ventall ample avall -->
    <polygon points="54,40 40,84 46,86" />
    <polygon points="54,40 46,86 54,88" />
    <polygon points="54,40 54,88 64,86" />
    <polygon points="56,42 64,86 72,78" />
    <polygon points="56,42 72,78 78,68" />

    <!-- CUA: 4 plomes des del darrere, ventall clar a l'esquerra -->
    <polygon points="38,46 8,38 14,46" />
    <polygon points="38,48 4,52 12,56" />
    <polygon points="38,50 4,64 12,64" />
    <polygon points="38,52 10,76 18,70" />
  </g>

  <!-- ULL -->
  <circle cx="54" cy="32" r="0.9" fill="#FFFFFF" />
</svg>
